name: build and release

on:
  push:
    tags:
      - "*"
    branches:
      - "master"


jobs:
  build:
    name: build and release sayclip
    runs-on: windows-latest
    steps:
      - name: setup_devenv
        uses: microsoft/setup-msbuild@v1
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: build sayclip
        run: |
          cd sayclip
          nuget restore sayclip.sln

          $pluginProjects = @(
            "googleTranslatorPlugin",
            "azureTranslatorPlugin",
            "fergunGoogleTranslator",
            "gTranslateBingTranslatorPlugin",
            "gTranslateGoogleTranslatorPlugin",
            "gTranslateGoogle2TranslatorPlugin",
            "gTranslateMicrosoftTranslatorPlugin",
            "gTranslateYandexTranslatorPlugin",
            "openRouterDotNetTranslatorPlugin"
          )

          foreach ($project in $pluginProjects) {
            Write-Host "Building plugin project: $project"
            msbuild ".\$project\$project.csproj" -p:configuration=release -p:Platform="x86"
          }

          msbuild .\sayclipTray\sayclipTray.csproj -p:configuration=release -p:Platform="x86"
          cd ..

          $releaseRoot = ".\sayclip\sayclipTray\bin\release"
          $stagingRoot = ".\sayclip\sayclipTray\bin\sayclip"

          if (Test-Path $stagingRoot) {
            Remove-Item $stagingRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $stagingRoot | Out-Null
          Copy-Item "$releaseRoot\*" $stagingRoot -Recurse -Force

          $pluginsPath = Join-Path $stagingRoot "plugins"
          if (Test-Path $pluginsPath) {
            7z a "$stagingRoot\plugins.package" "$pluginsPath\*"
            Remove-Item $pluginsPath -Recurse -Force
          }

          if (Test-Path .\sayclip.zip) {
            Remove-Item .\sayclip.zip -Force
          }

          7z a sayclip.zip "$stagingRoot\*"
      - name: generate version
        run: |
          python generateVersion.py
      - name: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "sayclip.zip,version.xml"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}